name: Build EXE
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pillow pyinstaller
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name BussidModExtractor BussidModExtractor.py
      - uses: actions/upload-artifact@v4
        with:
          name: BussidModExtractor-exe
          path: dist/BussidModExtractor.exe
